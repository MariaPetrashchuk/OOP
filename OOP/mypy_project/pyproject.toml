[project]
name = "mypy-project"
version = "0.1.0"
description = ""
authors = [
    {name = "MariaPetrashchuk",email = "mpetrashchuk2023@itcollege.lviv.ua"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.33.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "mypy_project", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.0.0,<3.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "types-requests (>=2.33.0.20260508,<3.0.0.0)"
]
